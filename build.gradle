buildscript {
	repositories {
		gradlePluginPortal()
		flatDir {
			dirs 'libs'
		}
		dependencies {
			classpath name:'package-compileonly-sdk', version: '1.7.0'
			classpath "com.gradleup.shadow:shadow-gradle-plugin:9.1.0"
		}
	}
}

plugins {
	id 'java'
	id "com.github.ben-manes.versions" version '0.53.0'
}

configure(allprojects){

	apply plugin: 'com.gradleup.shadow'
	apply plugin: "com.automationanywhere.command-codegen"

	ext {
		groupName = 'com.automationanywhere'
		testNgVersion = '7.12.0'
		loggerVersion = '2.25.3'
		version '5.3.4'
	}
	group "$groupName"

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(11)
		}
	}

	compileJava.options.encoding = 'UTF-8'
	compileTestJava.options.encoding = 'UTF-8'

	repositories {
		mavenCentral()
		flatDir {
			dirs 'libs'
		}
	}

	packageJson{
		artifactName = project.name
		group = "$groupName"
		author = "jamir-boop"
		generatePackageWithDateTime = false
	}

	jar.dependsOn commandCodeGen
	shadowJar.dependsOn commandCodeGen

	// SDK 1.7.0 deletes the copied template after merging. Restore it for incremental builds.
	commandCodeGen.doFirst {
		copy {
			from 'src/main/resources/package.template'
			into "$buildDir/resources/main"
		}
	}

	shadowJar {
		archiveBaseName = project.name
		archiveClassifier = ''
		zip64 = true
		exclude 'META-INF/MANIFEST.MF'
		exclude 'META-INF/*.SF'
		exclude 'META-INF/*.DSA'
		exclude 'META-INF/*.RSA'
		relocate 'org.apache.commons.io', 'botframework.shaded.commons.io'

		doLast {
			def json = new groovy.json.JsonSlurper()
			def generated = json.parse(file('build/generated/sources/annotationProcessor/java/main/tmp/commands.json'))
			def packaged
			new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip ->
				packaged = json.parse(zip.getInputStream(zip.getEntry('package.json')))
			}
			def controls
			controls = { attributes -> attributes.collect { attribute ->
				[name: attribute.name, type: attribute.type, defaultValue: attribute.defaultValue,
				 rules: (attribute.rules ?: []).collect { [name: it.name, value: it.value] },
				 attributes: controls(attribute.attributes ?: []),
				 options: (attribute.options ?: []).collect { [value: it.value, attributes: controls(it.attributes ?: [])] }]
			} }
			def expected = generated.collectEntries { [(it.name): controls(it.attributes ?: [])] }
			def actual = packaged.commands.collectEntries { [(it.name): controls(it.attributes ?: [])] }
			if (packaged.commands.size() != generated.size() || actual != expected
					|| packaged.packageVersion != project.version.toString() || packaged.codeVersion != project.version.toString()) {
				throw new GradleException('Packaged command controls or version differ from the current source.')
			}
		}
	}

	dependencies {
		annotationProcessor name: 'package-compileonly-sdk', version: '1.7.0'
		compileOnly name: 'package-compileonly-sdk', version: '1.7.0'

		implementation name: 'package-runtime-sdk', version: '1.0.0'
		testImplementation name: 'package-compileonly-sdk', version: '1.7.0'
		testImplementation group: "org.testng", name:"testng", version: "$testNgVersion"

		testImplementation 'com.google.protobuf:protobuf-java:4.34.0' //table,record type use this internally

		// https://mvnrepository.com/artifact/org.json/json
		implementation 'org.json:json:20251224'

		// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
		implementation group: "org.apache.logging.log4j", name: "log4j-api", version: "$loggerVersion"
		// https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
		implementation group: "org.apache.logging.log4j", name: "log4j-core", version: "$loggerVersion"

		// https://mvnrepository.com/artifact/commons-io/commons-io
		implementation 'commons-io:commons-io:2.22.0'
	}

	// Runs the viewer script on the template that ships in the JAR. Skipped when node is not installed.
	def viewerScriptTest = tasks.register('viewerScriptTest', Exec) {
		description = 'Runs src/test/js/dialog-dismiss.test.js on the packaged log viewer.'
		dependsOn processResources
		commandLine 'node', file('src/test/js/dialog-dismiss.test.js').absolutePath,
				layout.buildDirectory.file('resources/main/templates/log.html').get().asFile.absolutePath
		onlyIf {
			def found = false
			try {
				def node = new ProcessBuilder('node', '--version').redirectErrorStream(true).start()
				node.inputStream.text
				found = node.waitFor() == 0
			} catch (IOException ignored) {
			}
			if (!found) logger.lifecycle('Skipping viewerScriptTest: node was not found on PATH.')
			found
		}
	}

	test {
		useTestNG()
		dependsOn viewerScriptTest
		// Test side effects stay in build/. LC_ALL keeps non-ASCII file names working on Linux.
		environment 'LOCALAPPDATA', layout.buildDirectory.dir('test-appdata').get().asFile
		environment 'LC_ALL', 'C.UTF-8'
		systemProperty 'helios.outbox.directory', layout.buildDirectory.dir('test-outbox').get().asFile
		testLogging {
			// Print each test as it starts and finishes, plus everything the
			// test wrote to System.out / System.err (including log4j output
			// since log4j defaults to stderr). Mirrors what IntelliJ's
			// native test runner shows, but routed through the Gradle path
			// so the canonical task lifecycle still runs.
			events 'started', 'passed', 'skipped', 'failed',
			       'standard_out', 'standard_error'
			showStandardStreams = true
			exceptionFormat = 'full'
			showCauses = true
			showStackTraces = true
		}
	}

}
