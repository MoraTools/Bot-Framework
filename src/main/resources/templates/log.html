<!DOCTYPE html>
<!-- a360-log-format:7 -->
{{identity}}
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Bot Framework Logs</title>
    <style>
        :root {
            color-scheme: light dark;
            --primary: #1a73e8;
            --primary-soft: #e8f0fe;
            --secondary: #137333;
            --warning: #8a4b00;
            --danger: #b3261e;
            --surface: #ffffff;
            --surface-2: #f8f9fa;
            --text: #202124;
            --muted: #5f6368;
            --border: #dadce0;
            --hover: #f1f3f4;
            --radius-sm: 6px;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --message-lines: 5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #8ab4f8;
                --primary-soft: #1f3a5f;
                --secondary: #81c995;
                --warning: #fdd663;
                --danger: #f28b82;
                --surface: #1e1f22;
                --surface-2: #282a2e;
                --text: #e8eaed;
                --muted: #b0b5bc;
                --border: #45484e;
                --hover: #303339;
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { background: var(--surface); }
        body {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--text);
            background: var(--surface);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 14px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }
        ::selection { background: var(--primary-soft); color: var(--text); }
        a { color: var(--primary); text-underline-offset: 3px; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
        .session-context { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 18px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
        .session-context h1 { margin: 0; font-size: 18px; font-weight: 650; line-height: 1.3; flex-shrink: 0; }
        .identity { display: flex; flex-wrap: wrap; gap: 10px 24px; min-width: 0; margin: 0; }
        .identity > div { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .identity dt { font-size: 12px; color: var(--muted); }
        .identity dd { margin: 0; font-weight: 600; }
        .log-scroll { flex: 1; min-height: 0; min-width: 0; width: 100%; overflow: auto; scrollbar-color: var(--muted) var(--surface-2); }
        .log-table { width: 100%; min-width: 1060px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        .log-table th { position: sticky; top: 0; z-index: 2; background: #185abc; color: white; text-align: left; font-size: 11px; text-transform: uppercase; }
        .log-table th, .log-table td { padding: 8px 10px; vertical-align: top; border-bottom: 1px solid var(--border); }
        .log-table th:nth-child(1) { width: 160px; }
        .log-table th:nth-child(2) { width: 70px; }
        .log-table th:nth-child(3) { width: 23%; }
        .log-table th:nth-child(5) { width: 128px; }
        .log-table th:nth-child(6) { width: 116px; }
        .log-entry > td:nth-child(-n+3) { font-size: 12px; line-height: 1.4; }
        .vars-link, .more { font-size: 12px; white-space: nowrap; }
        .log-entry > td:first-child { font-variant-numeric: tabular-nums; }
        .log-entry:nth-child(odd) { background: var(--surface-2); }
        .log-entry:hover { background: var(--hover); outline: 2px solid var(--primary); outline-offset: -2px; }
        .log-entry.level-ERROR { background: #fce9e8; }
        .log-entry.level-ERROR:hover { background: #f8d2cc; outline-color: var(--danger); }
        .log-entry.level-WARN { background: #fef7e0; }
        .log-entry.level-WARN:hover { background: #feefc3; outline-color: var(--warning); }
        .level-INFO > td:nth-child(2) { color: var(--secondary); font-weight: 750; }
        .level-WARN > td:nth-child(2) { color: var(--warning); font-weight: 750; }
        .level-ERROR > td:nth-child(2) { color: var(--danger); font-weight: 750; }
        @media (prefers-color-scheme: dark) {
            .log-entry.level-ERROR { background: #3d2422; }
            .log-entry.level-ERROR:hover { background: #5d342d; }
            .log-entry.level-WARN { background: #3c3924; }
            .log-entry.level-WARN:hover { background: #4a4528; }
        }
        button { font: inherit; cursor: pointer; color: var(--primary); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; min-height: 36px; }
        button:hover { background: var(--primary-soft); }
        dialog { width: min(1100px, 96vw); max-height: 90vh; padding: 20px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); overflow: auto; }
        dialog::backdrop { background: rgba(0, 0, 0, .55); }
        .dialog-heading { display: flex; align-items: start; gap: 16px; justify-content: space-between; }
        .dialog-heading h2 { margin: 0; font-size: 20px; }
        #detail-context { color: var(--muted); margin: 8px 0 16px; }
        #detail-content > img, #detail-content > video { display: block; max-width: 100%; max-height: 65vh; margin: auto; }
        .log-table .empty-log > td { padding: 20px; color: var(--muted); }
        .empty-log:not(:last-child) { display: none; }
        .log-entry > td:nth-child(4) { white-space: pre-wrap; overflow-wrap: anywhere; }
        /* Only a page that runs the script cuts messages, so a page without JavaScript still shows every line. */
        .js .message { max-height: calc(var(--message-lines) * 1.55em); max-height: calc(var(--message-lines) * 1lh); overflow: hidden; }
        /* The last visible line fades, so a cut message reads as cut before the button is seen. */
        .js .message.cut { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1lh), rgb(0 0 0 / .3)); mask-image: linear-gradient(to bottom, #000 calc(100% - 1lh), rgb(0 0 0 / .3)); }
        .js .message.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
        .more { display: none; margin-top: 6px; font-weight: 600; }
        .js .message.cut:not(.open) + .more { display: inline-flex; align-items: center; gap: 8px; }
        .more > svg { flex: none; fill: currentColor; }
        .message-lead { margin: 0 0 12px; font-weight: 600; white-space: pre-wrap; }
        .message-full { margin: 0; padding: 12px 14px; font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; }
        .entry-variables { margin-top: 10px; }
        summary { cursor: pointer; min-height: 36px; padding: 6px 0; }
        summary:hover { color: var(--primary); }
        .entry-variables > summary { width: fit-content; color: var(--primary); font-weight: 600; }
        .variable-list { min-width: 0; padding: 0 0 4px; }
        .variable-card { min-width: 0; padding: 12px 0; border-top: 1px solid var(--border); }
        .variable-name { display: inline; margin-right: 10px; font-weight: 650; }
        .variable-type { display: inline; font-size: 11px; color: var(--muted); }
        .variable-value {
            margin-top: 6px;
            font-family: var(--mono);
            font-size: 13px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .variable-card > details { margin-top: 6px; }
        .nested-content { padding-left: 20px; border-left: 1px solid var(--border); }
        .nested-content > .variable-card:first-child { border-top: 0; }
        .entry-variables details.full-width > summary {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--surface);
            font-weight: 600;
        }
        .table-container {
            max-width: 100%;
            max-height: 65vh;
            overflow: auto;
            scrollbar-color: var(--muted) var(--surface-2);
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .table-container table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .table-container th, .table-container td {
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            min-width: 140px;
            border-bottom: 1px solid var(--border);
        }
        .table-container th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); font-size: 12px; }
        .table-container tr:last-child td { border-bottom: 0; }
        .table-container tr:has(td):hover { background: var(--hover); }
        .table-container td > .variable-value { margin-top: 0; }
        .table-container .table-container { max-height: 40vh; }
        .ws-marker, .ws-tab, .ws-nl { color: var(--muted); user-select: none; }
        .ws-tab, .ws-nl { font-size: 0.85em; font-style: normal; }
        .ws-tab { margin-right: -0.4em; }
        .ws-nl { margin-left: 2px; }
        .ws-tab::before { content: '→'; }
        .ws-nl::before { content: '↵'; }
        .ws-trail { position: relative; }
        .ws-trail > .ws-marker { position: absolute; left: 0; top: 0; pointer-events: none; }
        .img-link { display: inline-flex; position: relative; border-radius: var(--radius-sm); }
        .img-link img {
            display: block;
            width: 88px;
            height: 50px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
        }
        .img-link:hover img, .img-link:focus-visible img { border-color: var(--primary); }
        .img-link:hover::after, .img-link:focus-visible::after {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(75vw, 1280px);
            aspect-ratio: 16 / 9;
            max-height: calc(100vh - 48px);
            background: var(--surface) var(--screenshot-preview) center / contain no-repeat;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            z-index: 10;
            pointer-events: none;
        }
        .video-link .play-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 22px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        .video-link { min-width: 88px; min-height: 50px; }
        .video-link .play-overlay:first-child { background: #202124; border-radius: inherit; }
        .no-video-badge {
            position: absolute; bottom: 2px; right: 2px;
            padding: 1px 4px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 10px;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .session-context { align-items: start; flex-direction: column; gap: 10px; padding: 14px; }
            .identity > div { display: grid; gap: 1px; }
            button { min-height: 44px; }
            summary { min-height: 44px; padding-top: 10px; padding-bottom: 10px; }
            .table-container th, .table-container td { min-width: 120px; padding: 8px 10px; }
            .nested-content { padding-left: 12px; }
            .img-link:hover::after, .img-link:focus-visible::after { width: 92vw; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto; transition: none; }
        }
        @media print {
            .js .message { max-height: none; -webkit-mask-image: none; mask-image: none; }
            .more { display: none !important; }
        }
    </style>
</head>
<body>
<header class='session-context'>
    <h1>Bot Framework Logs</h1>
    <dl class='identity'><div><dt>Machine</dt><dd>{{machine}}</dd></div><div><dt>User</dt><dd>{{user}}</dd></div></dl>
</header>
<dialog id='detail' closedby='any' aria-labelledby='detail-title' aria-describedby='detail-context'>
    <div class='dialog-heading'><h2 id='detail-title'>Variables</h2><button type='button' id='detail-close' autofocus>Close</button></div>
    <p id='detail-context'></p><div id='detail-content' aria-live='polite'></div>
</dialog>
<script>
(() => {
    document.documentElement.classList.add('js');
    const dialog = document.getElementById('detail'), content = document.getElementById('detail-content');
    let request = 0, opener, frame;
    // Reads every height before it writes a class, so one layout serves the whole log.
    function markCutMessages() {
        const messages = document.querySelectorAll('.message');
        const cut = Array.from(messages, message => message.scrollHeight > message.clientHeight + 1);
        messages.forEach((message, index) => {
            message.classList.toggle('cut', cut[index]);
            if (cut[index] && !message.nextElementSibling?.classList.contains('more')) {
                const more = document.createElement('button');
                more.type = 'button'; more.className = 'more';
                more.innerHTML = "<svg width='16' height='4' viewBox='0 0 16 4' aria-hidden='true'><circle cx='2' cy='2' r='2'/>"
                    + "<circle cx='8' cy='2' r='2'/><circle cx='14' cy='2' r='2'/></svg>Show full message";
                message.after(more);
            }
        });
    }
    document.addEventListener('DOMContentLoaded', markCutMessages);
    addEventListener('resize', () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(markCutMessages); });
    // The message text without the whitespace markers.
    function messageText(message) {
        const walker = document.createTreeWalker(message, NodeFilter.SHOW_TEXT, {acceptNode: node =>
            node.parentElement.closest('.ws-marker') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
        let text = '';
        while (walker.nextNode()) text += walker.currentNode.nodeValue;
        return text;
    }
    // Like JSON.stringify(value, null, 2), but a string value shows its line breaks, for example a page dump.
    function pretty(value, indent) {
        const inner = indent + '  ';
        if (Array.isArray(value)) {
            return value.length ? '[\n' + value.map(item => inner + pretty(item, inner)).join(',\n') + '\n' + indent + ']' : '[]';
        }
        if (value && typeof value === 'object') {
            const keys = Object.keys(value);
            return keys.length ? '{\n' + keys.map(key => inner + JSON.stringify(key) + ': ' + pretty(value[key], inner)).join(',\n')
                + '\n' + indent + '}' : '{}';
        }
        if (typeof value !== 'string') return JSON.stringify(value);
        return '"' + value.split(/\r?\n/).map(line => JSON.stringify(line).slice(1, -1)).join('\n' + inner) + '"';
    }
    // A message that ends in JSON, for example 'bridge_response {...}', opens with the JSON indented.
    function showMessage(text) {
        const start = text.search(/[[{]/);
        let lead = '', body = text;
        if (start >= 0) {
            try { body = pretty(JSON.parse(text.slice(start)), ''); lead = text.slice(0, start).trim(); }
            catch (notJson) { body = text; }
        }
        if (lead) { const paragraph = document.createElement('p'); paragraph.className = 'message-lead'; paragraph.textContent = lead; content.append(paragraph); }
        const full = document.createElement('pre');
        full.className = 'message-full'; full.textContent = body;
        content.append(full);
    }
    function clear() {
        request++;
        const video = content.querySelector('video');
        if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
        content.replaceChildren();
    }
    document.getElementById('detail-close').onclick = () => dialog.close();
    dialog.addEventListener('close', () => { clear(); if (opener) opener.focus({preventScroll: true}); });
    if (!('closedBy' in dialog)) {
        let startedOutside = false;
        const isOutside = event => {
            const rect = dialog.getBoundingClientRect();
            return event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right
                || event.clientY < rect.top || event.clientY > rect.bottom);
        };
        dialog.addEventListener('pointerdown', event => {
            startedOutside = event.isPrimary && event.button === 0 && isOutside(event);
        });
        dialog.addEventListener('pointercancel', () => { startedOutside = false; });
        dialog.addEventListener('close', () => { startedOutside = false; });
        dialog.addEventListener('click', event => {
            const dismiss = startedOutside && event.button === 0 && isOutside(event);
            startedOutside = false;
            if (dismiss) dialog.close();
        });
    }
    document.addEventListener('click', async event => {
        const control = event.target.closest('[data-vars], .img-link, .more');
        if (!control || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
        const message = control.classList.contains('more');
        if (!dialog.showModal) {
            if (message) control.previousElementSibling.classList.add('open');
            else if (control.hasAttribute('data-vars')) alert('This browser cannot open variables. Open this file in a current version of Chrome, Edge, Firefox, or Safari.');
            return;
        }
        event.preventDefault();
        clear();
        const ticket = request;
        opener = control;
        const variables = control.hasAttribute('data-vars'), video = control.classList.contains('video-link');
        document.getElementById('detail-title').textContent = message ? 'Message' : variables ? 'Variables' : video ? 'Recording' : 'Screenshot';
        const cells = control.closest('tr').cells;
        document.getElementById('detail-context').textContent = [cells[0], cells[1], cells[2]].map(cell => cell.textContent).join(' · ');
        dialog.showModal();
        if (message) {
            showMessage(messageText(control.previousElementSibling));
        } else if (variables) {
            content.textContent = 'Loading variables…';
            try {
                if (!window.DecompressionStream) throw new Error('unsupported');
                const bytes = Uint8Array.from(atob(control.dataset.vars), c => c.charCodeAt(0));
                const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
                if (ticket !== request || !dialog.open) return;
                // Only the escaped HTML generated by the logger is stored in this snapshot.
                content.innerHTML = html;
                const snapshot = content.querySelector('.entry-variables');
                if (snapshot) snapshot.open = true;
            } catch (error) {
                if (ticket !== request || !dialog.open) return;
                content.textContent = error.message === 'unsupported'
                    ? 'This browser cannot decompress variables. Open this file in a current version of Chrome, Edge, Firefox, or Safari.'
                    : 'Cannot read this variable snapshot. Try the original log file or another current browser.';
            }
        } else {
            const media = document.createElement(video ? 'video' : 'img');
            media.src = control.href;
            if (video) { media.controls = true; media.preload = 'none'; const poster = control.querySelector('img'); if (poster) media.poster = poster.src; }
            else media.alt = control.getAttribute('aria-label') || 'Screenshot';
            const link = document.createElement('a');
            link.href = control.href; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Open original file';
            const paragraph = document.createElement('p'); paragraph.append(link);
            const failure = document.createElement('p');
            media.addEventListener('error', () => {
                if (ticket === request && dialog.open) failure.textContent = 'Media file unavailable. Keep the screenshots and clips folders beside this HTML file.';
            });
            content.append(media, failure, paragraph);
        }
    });
})();
</script>
<noscript>JavaScript is required to open compressed variables. Messages and media links remain available.</noscript>
<div class='log-scroll' tabindex='0' role='region' aria-label='Log entries'>
<table class='log-table'>
<thead><tr><th scope='col'>Datetime</th><th scope='col'>Level</th><th scope='col'>Source</th><th scope='col'>Message</th><th scope='col'>Variables</th><th scope='col'>Screen</th></tr></thead>
<tbody>
<tr class='empty-log'><td colspan='6'>No entries yet.</td></tr>
<!-- a360-log-header:end -->
