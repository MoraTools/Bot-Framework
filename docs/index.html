"decisions":[
{"id":"DL-0001","date":"2026-05-10","area":"architecture","status":"accepted","title":"Rolling two-stage screen recording","context":"Commit e81c496. The pipeline follows the AA BotClipRecorderService pattern.","decision":"Keep a rolling FFmpeg ring of the screen (gdigrab + ffvhuff, 1 s segments) and encode an MP4 clip next to the log only when an entry fires at a selected level. Salvage the ring after a JVM crash at the next start.","options":"","consequences":"Needs an interactive desktop on the runner. Disk and CPU cost per session (see Deployment).","source":""},
{"id":"DL-0002","date":"2026-05-10","area":"deployment","status":"accepted","title":"Bundle a GPL FFmpeg 6.0 build","context":"Commit a911599.","decision":"Bundle a cross-compiled FFmpeg n6.0 with only libx264, libaom-av1, ffvhuff and the segment, concat and mp4 muxers. Offer Fast (H.264, default) and Compact (AV1) modes. Buffer limit 90 s.","options":"Stripped LGPL FFmpeg (replaced). Buffer ceiling of 300 s (lowered to 90 s).","consequences":"The bundled binary is GPL-2.0 or later; mind licensing when redistributing. Binary about 13.4 MB.","source":""},
{"id":"DL-0003","date":"2026-09-10","area":"deployment","status":"accepted","title":"Fork owned by jamir-boop","context":"Commit da0c186. Local origin is MoraTools/Bot-Framework.","decision":"Maintain the package as a fork of A360-Tools/Bot-Framework with author jamir-boop (4.0.0, breaking).","options":"","consequences":"","source":""},
{"id":"DL-0004","date":"2026-09-10","area":"architecture","status":"accepted","title":"Optional Helios Cloud streaming per logger session","context":"Commit da0c186. Off by default.","decision":"Start Logger Session gets an optional Helios Cloud URL and ingest key. Entries go through a Log4j appender; session start and end through HeliosSink. Streaming never fails the bot.","options":"","consequences":"","source":""},
{"id":"DL-0005","date":"2026-09-11","area":"data","status":"accepted","title":"Journal every Helios entry before delivery","context":"Commit 1fd11ae; behavior in README \"Failure behaviour\".","decision":"Number each entry and write it to a UTF-8 disk journal before network delivery. Delete the journal only after a verified receipt. Retry pending journals at a later logger start with the same OS user, URL and key.","options":"","consequences":"Journals hold logged variable values but no ingest keys. Disk use can exceed one session limit with several sessions.","source":""},
{"id":"DL-0006","date":"2026-09-30","area":"development","status":"accepted","title":"Version check in the shadow JAR build","context":"Commit 2c10cbc. AGENTS.md: increase the version in build.gradle before a delivery, keep README in step; renaming the JAR is not a version change.","decision":"shadowJar fails when the packaged command controls, packageVersion or codeVersion differ from the current source.","options":"","consequences":"","source":""},
{"id":"DL-0007","date":"2026-09-30","area":"architecture","status":"accepted","title":"Helios ERROR media follows the screen recording settings","context":"Commit 2c10cbc; README \"Helios ERROR media\".","decision":"Upload ERROR screenshots and clips to Helios with the existing Screen recording settings. No separate media control.","options":"","consequences":"Screenshots expire after 14 days and videos after 3 days on Helios. 256 MiB media copy budget per OS user.","source":""},
{"id":"DL-0010","date":"2026-10-21","area":"architecture","status":"accepted","title":"logExternal API for other packages","context":"Commit 0df7970 (5.1.0). Used by BetterRecorder (workspace guide).","decision":"Other packages write to an open logger session through a reflective logExternal call that uses only JDK types, so they need no dependency on this package.","options":"","consequences":"","source":""},
{"id":"DL-0011","date":"2026-10-23","area":"security","status":"accepted","title":"Mask Credential values at any depth","context":"aa-kb card, review round of 2026-10-23; released in 5.2.0.","decision":"Show every Credential value as ******** in the HTML log and in Helios, also inside List, Dictionary, Record and Table variables.","options":"","consequences":"Before, the HTML log showed nested credentials as plain text.","source":""},
{"id":"DL-0012","date":"2026-10-27","area":"development","status":"accepted","title":"Ship the log viewer unminified","context":"Commit c393d5d (5.2.0 and 5.3.0 work).","decision":"Ship src/main/resources/templates/log.html unchanged. The build needs no Node.js; the viewer script test runs only when node is on the PATH.","options":"","consequences":"","source":""},
{"id":"DL-0013","date":"2026-10-27","area":"data","status":"accepted","title":"HTML log format 7 with lock and contention sidecars","context":"Commit c393d5d.","decision":"Write HTML format 7. Each HTML file has \u003clog>.a360.lock (OS lock) and \u003clog>.a360-contention (notice from a rejected process). Keep the intact archives: move an older, different-identity or incomplete file intact to the next numbered archive.","options":"","consequences":"Do not delete the sidecars while a bot that uses the log runs.","source":""},
{"id":"DL-0014","date":"2026-10-27","area":"architecture","status":"accepted","title":"Remove Read Excel and Read CSV","context":"Commit c393d5d (breaking). First uploaded in 5.2.0 on 2026-10-25.","decision":"Remove the Read Excel and Read CSV actions and the POI and commons-csv dependencies. Read JSON and Read XML stay.","options":"","consequences":"","source":""},
{"id":"DL-0015","date":"2026-10-27","area":"operations","status":"accepted","title":"Close Application kills at once","context":"Commit c393d5d (breaking).","decision":"Close Application terminates the listed applications at once with one hard kill per process.","options":"","consequences":"Unsaved work in those applications is lost.","source":""},
{"id":"DL-0016","date":"2026-10-27","area":"security","status":"accepted","title":"Create Folders checks all paths before changes","context":"Commit c393d5d (breaking); docs/device/CreateFolders.md.","decision":"Reject blank paths, roots, missing roots, relative paths that leave the base, and, with Overwrite on, overlapping paths and folders that are or contain links or junctions. Change no folder when one path is rejected.","options":"","consequences":"Overwrite still deletes recursively. Paths accepted before can now fail.","source":""},
{"id":"DL-0017","date":"2026-10-27","area":"architecture","status":"accepted","title":"Require Helios Cloud 0.5.0 or later","context":"Commit c393d5d. 0.7.1 was used for the delivery checks.","decision":"Require Helios Cloud 0.5.0 or later and remove the code for older servers and journals. An invalid Helios URL gives one warning and saves nothing for Helios.","options":"","consequences":"","source":""},
{"id":"DL-0018","date":"2026-10-27","area":"data","status":"accepted","title":"Upload Helios media from memory","context":"Commit 5cdd78a (5.3.1). On Windows the publisher still held the .ready file when Helios answered early, so 5.3.0 sent the same clip about every 0.7 s.","decision":"Send media upload bytes from memory, not through the JDK file publisher.","options":"","consequences":"Media warnings name the exception class only, never its message.","source":""},
{"id":"DL-0019","date":"2026-10-27","area":"operations","status":"accepted","title":"Wait for end-of-run ERROR media","context":"Commit 117629f (5.3.2). AA closes the logger session at bot end also without Stop Logger Session (live run L2).","decision":"After the recorder drain at close, wait up to 30 s for this session ERROR media whose rows Helios stored, then stop the sender with at most 1 s more.","options":"","consequences":"Delivery after JVM exit is not guaranteed.","source":""},
{"id":"DL-0021","date":"2026-10-28","area":"data","status":"accepted","title":"Rename older journals that stay incomplete","context":"Commit e977f1a (5.3.3). Before, these journals were sent again at every logger start.","decision":"Also rename an older journal to \u003cname>.helios-journal.unverified when it is still incomplete after its repair pass (for example after an HTTP 413 oversized entry). Write one local WARN with the new name and the reason. Never rename the journal of the running session.","options":"","consequences":"","source":""},
{"id":"DL-0022","date":"2026-05-09","area":"development","status":"accepted","title":"Run the Gradle daemon on JDK 11","context":"A360 packages run on Java 11. Gradle 8.14 bundles Groovy 3.0.24, which fails on class files above major version 65 (JDK 22+).","decision":"Pin org.gradle.java.home to a JDK 11 in a gitignored gradle.properties copied from gradle.properties.example.","options":"","consequences":"","source":""}
],

"sections":{"architecture":"Dashed boxes are outside this package.\n\n\u003csvg xmlns='http://www.w3.org/2000/svg' width='760' height='300' viewBox='0 0 760 300' fill='none' stroke='currentColor' font-family='sans-serif' font-size='13'>\n\u003ctitle>Bot-Framework main parts and data flow\u003c/title>\n\u003cdefs>\u003cmarker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'>\u003cpath d='M0,0 L10,5 L0,10 z' fill='currentColor'/>\u003c/marker>\u003c/defs>\n\u003crect x='10' y='20' width='160' height='44' rx='6' stroke-dasharray='4 3'/>\n\u003ctext x='90' y='47' text-anchor='middle' fill='currentColor' stroke='none'>Bot on a Bot Agent\u003c/text>\n\u003crect x='10' y='160' width='160' height='44' rx='6' stroke-dasharray='4 3'/>\n\u003ctext x='90' y='187' text-anchor='middle' fill='currentColor' stroke='none'>Other packages\u003c/text>\n\u003crect x='200' y='20' width='160' height='44' rx='6'/>\n\u003ctext x='280' y='38' text-anchor='middle' fill='currentColor' stroke='none'>12 actions\u003c/text>\n\u003ctext x='280' y='55' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>config, device, docs, logs\u003c/text>\n\u003crect x='200' y='160' width='160' height='44' rx='6'/>\n\u003ctext x='280' y='178' text-anchor='middle' fill='currentColor' stroke='none'>Logger session\u003c/text>\n\u003ctext x='280' y='195' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>Log4j, CustomLogger\u003c/text>\n\u003crect x='400' y='90' width='160' height='44' rx='6'/>\n\u003ctext x='480' y='108' text-anchor='middle' fill='currentColor' stroke='none'>HTML log (format 7)\u003c/text>\n\u003ctext x='480' y='125' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>screenshots, clips/\u003c/text>\n\u003crect x='400' y='160' width='160' height='44' rx='6'/>\n\u003ctext x='480' y='178' text-anchor='middle' fill='currentColor' stroke='none'>FFmpeg 6.0 ring\u003c/text>\n\u003ctext x='480' y='195' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>%LOCALAPPDATA%\u003c/text>\n\u003crect x='400' y='230' width='160' height='44' rx='6'/>\n\u003ctext x='480' y='248' text-anchor='middle' fill='currentColor' stroke='none'>Journal, media outbox\u003c/text>\n\u003ctext x='480' y='265' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>~/.helios/outbox\u003c/text>\n\u003crect x='590' y='90' width='160' height='44' rx='6' stroke-dasharray='4 3'/>\n\u003ctext x='670' y='117' text-anchor='middle' fill='currentColor' stroke='none'>Helios Control Room\u003c/text>\n\u003crect x='590' y='230' width='160' height='44' rx='6' stroke-dasharray='4 3'/>\n\u003ctext x='670' y='248' text-anchor='middle' fill='currentColor' stroke='none'>Helios Cloud\u003c/text>\n\u003ctext x='670' y='265' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>0.5.0 or later\u003c/text>\n\u003cline x1='170' y1='42' x2='198' y2='42' marker-end='url(#arrow)'/>\n\u003cline x1='280' y1='64' x2='280' y2='158' marker-end='url(#arrow)'/>\n\u003cline x1='170' y1='182' x2='198' y2='182' marker-end='url(#arrow)'/>\n\u003ctext x='185' y='222' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>logExternal()\u003c/text>\n\u003cline x1='360' y1='172' x2='398' y2='118' marker-end='url(#arrow)'/>\n\u003cline x1='360' y1='182' x2='398' y2='182' marker-end='url(#arrow)'/>\n\u003cline x1='360' y1='194' x2='398' y2='246' marker-end='url(#arrow)'/>\n\u003cline x1='480' y1='160' x2='480' y2='136' marker-end='url(#arrow)'/>\n\u003ctext x='520' y='152' fill='currentColor' stroke='none' font-size='11'>MP4\u003c/text>\n\u003cline x1='560' y1='112' x2='588' y2='112' marker-end='url(#arrow)'/>\n\u003ctext x='575' y='84' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>reads folders\u003c/text>\n\u003cline x1='560' y1='252' x2='588' y2='252' marker-end='url(#arrow)'/>\n\u003ctext x='575' y='224' text-anchor='middle' fill='currentColor' stroke='none' font-size='11'>HTTP\u003c/text>\n\u003c/svg>\n\n| Part | Code | Role |\n|---|---|---|\n| Actions | `src/main/java/com/automationanywhere/botcommand/actions/` | 12 actions: `config` (Read JSON, Read XML), `device` (Clean Directory, Create Folders, Close Applications), `documentation` (About, Comment, Steps, Caution Steps), `logs` (Start Logger Session, Log Message, Stop Logger Session). |\n| HTML logger | `utilities/logger/` | Log4j session logger. HTML format 7, entry-count rollover, per-level files, `\u003clog>.a360.lock` and `\u003clog>.a360-contention` sidecars. Viewer: `src/main/resources/templates/log.html`. |\n| Screen recorder | `utilities/screen/recorder/` | Stage 1: FFmpeg `gdigrab` + `ffvhuff` into a 1 s segment ring (5-90 s, default 30 s). Stage 2: concat and encode an MP4 clip (Fast H.264 or Compact AV1) next to the log. Crash salvage at the next start. |\n| Helios streaming | `utilities/helios/` | Optional per session. Disk journal, then batched `POST {url}/api/ingest/sessions/...`. ERROR media through a separate outbox with raw file PUT. |\n| External API | `logExternal(level, message, source, screenshot, attachment)` | Reflective call with JDK types only. Helios gets only WARN and ERROR. |\n\n| Store | Location | Limit |\n|---|---|---|\n| HTML log and media | log folder chosen in the bot | Rollover by entry count (default 1000). |\n| Recorder ring | `%LOCALAPPDATA%\\A360-BotFramework\\` | ~30-100 MB per session at defaults. |\n| Helios journals | `\u003cuser.home>/.helios/outbox/` | 256 MiB per session (`HELIOS_BUFFER_MIB`, 1-65536). No automatic deletion of unverified journals. |\n| Helios media copies | `~/.helios/outbox/media` | 256 MiB across sessions for one OS user. |\n\nHelios streaming never fails the bot. Delivery is verified by ordinal sequence; a journal is deleted only after a verified receipt. The ingest key travels in the `X-Helios-Ingest-Key` header and is not written to journals or media manifests.","deployment":"| Item | Value |\n|---|---|\n| Artifact | `build/libs/A360BotFramework-\u003cversion>.jar` (shadow JAR, commons-io relocated to `botframework.shaded.commons.io`) |\n| Target | A360 Control Room package; runs inside bots on Windows Bot Agents |\n| Control Room | protecta: 5.3.2 (id 100022508) DEFAULT since 2026-10-27; 5.2.0, 5.3.0, 5.3.1 ENABLED (aa-kb card, 2026-10-27) |\n| Git | `main` and `release-5.1.0` at `e977f1a` (5.3.3), pushed to `origin` (fork `MoraTools/Bot-Framework`); tags `A360BotFramework-5.3.2`, `A360BotFramework-5.3.3` |\n| Upstream | `github.com/A360-Tools/Bot-Framework` |\n| Helios Cloud | 0.5.0 or later required; 0.7.1 used for delivery checks |\n| FFmpeg | 6.0, GPL-2.0 or later, extracted to `%LOCALAPPDATA%\\A360-BotFramework\\ffmpeg\\\u003chash>\\ffmpeg.exe` |\n\n- Every bot on one machine must use 5.0.1 or later: older packages delete `.salvaging` folders while recovery runs.\n- Pair `Start Logger Session` with `Stop Logger Session` in a Finally block. AA also closes the session at bot end; delivery after JVM exit is not guaranteed.\n- Runner settings: `HELIOS_BUFFER_MIB` (restart the Bot Agent), Java properties `helios.bufferMiB` and `helios.outbox.directory`.\n- Pending journals under an old ingest key need operator attention.\n- Before a delivery, increase `version` in `build.gradle` and the version in `README.md`. The `shadowJar` task fails when `packageVersion` or `codeVersion` in the JAR differ from the project version.","development":"| Task | Command |\n|---|---|\n| Setup | `cp gradle.properties.example gradle.properties`, set `org.gradle.java.home` to a JDK 11, then `./gradlew --stop` |\n| Build and test | `./gradlew clean test shadowJar --console=plain` |\n| Test only | `./gradlew test` (Windows: `.\\gradlew.bat test`) |\n| Build on Windows | `.\\gradlew.bat clean build shadowJar` |\n| Build (README) | `gradle clean build :shadowJar` |\n| FFmpeg rebuild | `tools/ffmpeg-build/Dockerfile` (tag `n6.0`) |\n\n| Pin | Version |\n|---|---|\n| Java | 11 (toolchain and Gradle daemon) |\n| Gradle wrapper | 8.14.4 |\n| Package SDK | compile-only 1.7.0, runtime 1.0.0 (vendored in `libs/`) |\n| Shadow plugin | `com.gradleup.shadow` 9.1.0 |\n| TestNG, log4j, commons-io, org.json | 7.12.0, 2.25.3, 2.22.0, 20251224 |\n\n- Tests use TestNG. `viewerScriptTest` runs `src/test/js/dialog-dismiss.test.js` only when `node` is on the PATH.\n- Tests set `LOCALAPPDATA` and `helios.outbox.directory` under `build/`.\n- On Linux 14 tests fail and 4 skip for Windows-only reasons. The Windows build host is the acceptance environment.\n- Screen-capture tests skip when the JVM is headless."}

es:{name:'Español',decisions:'Decisiones',status:'Estado',work:'Trabajo pendiente',architecture:'Arquitectura',deployment:'Despliegue',development:'Desarrollo',security:'Seguridad',data:'Datos',operations:'Operaciones',product:'Producto',updated:'Actualizado',context:'Contexto',decision:'Decisión',options:'Opciones',consequences:'Consecuencias',source:'Fuente',dateUnknown:'fecha desconocida',item:'Tarea',priority:'Prioridad',high:'alta',medium:'media',low:'baja',owner:'A cargo',copy:'Copiar',copied:'Copiado',copyFailed:'Seleccione el código',light:'Claro',dark:'Oscuro',theme:'Cambiar tema',skip:'Ir al contenido',sections:'Secciones',proposed:'propuesta',accepted:'aceptada',rejected:'rechazada',open:'pendiente',doing:'en curso',blocked:'bloqueada',done:'terminada',dropped:'descartada'}};
const store=(key,value)=>{try{if(value===undefined)return localStorage.getItem(key);value===null?localStorage.removeItem(key):localStorage.setItem(key,value)}catch(e){}};
let lang=store('html-docs-lang')||navigator.language.split('-')[0];if(!data.langs.includes(lang))lang=data.langs[0];
let clicked=null,pinY;
const t=key=>L[lang][key]||key;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>typeof v==='string'?v:(v?.[lang]||'');
const safe=url=>!/[\s\u0000-\u001f]/.test(url)&&!url.startsWith('//')&&(!/^[a-z][a-z\d+.-]*:/i.test(url)||/^(https?:|mailto:)/i.test(url));
function inline(value){
const tokens=[];const token=html=>'\u0000'+(tokens.push(html)-1)+'\u0000';
let out=String(value).replace(/\u0000/g,'').replace(/`([^`]+)`/g,(_,s)=>token('<code>'+esc(s)+'</code>'));
out=esc(out).replace(/\[([^\]\n]+)\]\(([^\s)]+)\)/g,(_,s,u)=>safe(u)?token('<a href="'+u+'">'+s+'</a>'):s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const restore=s=>s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[i]);return restore(restore(out));
}
function svg(raw){
const top=new DOMParser().parseFromString(raw,'image/svg+xml').documentElement;
if(top.localName!=='svg'||top.querySelector('parsererror'))return '';
const tags=new Set('svg g a path rect circle ellipse line polyline polygon text tspan title desc defs marker use symbol clipPath mask linearGradient radialGradient stop'.split(' '));
for(const el of [top,...top.querySelectorAll('*')]){
if(!tags.has(el.localName)){el.replaceWith(...el.childNodes);continue}// Unwrap: keep the children, which are checked too.
// No style or event handlers; links and url() may point only to #ids; no escapes.
for(const a of [...el.attributes])if(/^on/i.test(a.name)||(/href$/i.test(a.name)&&!a.value.startsWith('#'))||/url\(\s*['"]?(?!#)/i.test(a.value)||/\\/.test(a.value)||a.name.toLowerCase()==='style')el.removeAttribute(a.name);
}
return new XMLSerializer().serializeToString(top);
}
function markdown(lines){
let out='',i=0;
const cells=s=>s.replace(/\\\|/g,'\u0001').trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim().replace(/\u0001/g,'|'));// \| is a literal pipe.
while(i<lines.length){
const line=lines[i];if(!line.trim()){i++;continue}
if(/^\s*```/.test(line)){let code=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))code.push(lines[i++]);i++;out+='<pre><button type="button" class="copy"></button><code>'+esc(code.join('\n'))+'</code></pre>';continue}
if(/^\s*<svg\b/.test(line)){let raw=[];do{raw.push(lines[i++])}while(i<lines.length&&!raw[raw.length-1].includes('</svg>'));out+=svg(raw.join('\n'));continue}
if(/^\s*\|/.test(line)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(cells(lines[i++]));out+='<div class="table-wrap"><table><thead><tr>'+rows.shift().map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.filter(r=>!r.every(c=>/^:?-{3,}:?$/.test(c))).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
const head=line.match(/^(#{1,2}) (.*)/);if(head){const h='h'+(head[1].length+2);out+='<'+h+'>'+inline(head[2])+'</'+h+'>';i++;continue}
const [tag,re]=/^\s*- /.test(line)?['ul',/^\s*- /]:['ol',/^\s*\d+\. /];
if(re.test(line)){out+='<'+tag+'>';while(i<lines.length&&re.test(lines[i]))out+='<li>'+inline(lines[i++].replace(re,''))+'</li>';out+='</'+tag+'>';continue}
let p=[lines[i++]];while(i<lines.length&&lines[i].trim()&&!/^(\s*(```|<svg\b|\||- |\d+\. )|##? )/.test(lines[i]))p.push(lines[i++]);out+='<p>'+inline(p.join('\n'))+'</p>';
}return out;
}
function render(){
root.lang=lang;document.title=text(data.title);$('main h1').textContent=text(data.title);
const brand=$('.brand'),title=text(data.title);brand.textContent=title;
if(data.logo&&safe(data.logo)){const img=new Image();img.alt=title;img.onerror=()=>img.replaceWith(title);img.src=data.logo;brand.replaceChildren(img)}
$('.meta').textContent=t('updated')+' '+data.updated;$('.skip').textContent=t('skip');
const sections=[];const add=(id,title,body)=>{if(body)sections.push({id,title,body})};
const badge=s=>'<span class="badge '+s+'">'+esc(t(s))+'</span>';
add('decisions',t('decisions'),[...data.decisions].sort((a,b)=>b.id.localeCompare(a.id,'en',{numeric:true})).map(d=>{
const tag='<span class="tag"><span class="id">'+esc(d.id)+'</span> · '+esc([d.date||t('dateUnknown'),t(d.area).toLowerCase()].join(' · '))+'</span> '+badge(d.status);
const body='<dl>'+['context','decision','options','consequences'].map(k=>text(d[k])?'<dt>'+t(k)+'</dt><dd>'+inline(text(d[k]))+'</dd>':'').join('')+(d.source?'<dt>'+t('source')+'</dt><dd>'+inline(d.source)+'</dd>':'')+'</dl>';
return d.status==='rejected'?'<details id="'+d.id+'" class="dim"><summary>'+tag+' '+inline(text(d.title))+'</summary>'+body+'</details>':'<article id="'+d.id+'">'+tag+'<h3>'+inline(text(d.title))+'</h3>'+body+'</article>'}).join(''));
add('status',t('status'),text(data.status)?'<p>'+inline(text(data.status))+'</p>':'');
// Active items first; in each group high, then medium or none, then low; else the stored order.
const pri=data.open.some(o=>o.priority),rank=o=>['done','dropped'].includes(o.status)*3+({high:0,low:2}[o.priority]??1);
add('open',t('work'),data.open.length?'<div class="table-wrap"><table><thead><tr>'+['ID',t('item'),t('status'),...pri?[t('priority')]:[],t('owner')].map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+[...data.open].sort((a,b)=>rank(a)-rank(b)).map(o=>'<tr id="'+esc(o.id)+'" class="'+esc(o.status)+'"><td class="id">'+esc(o.id)+'</td><td>'+inline(text(o.item))+'</td><td>'+badge(o.status)+'</td>'+(pri?'<td>'+(o.priority?esc(t(o.priority)):'')+'</td>':'')+'<td>'+esc(o.owner)+'</td></tr>').join('')+'</tbody></table></div>':'');
const fixed=['architecture','deployment','development'];
for(const key of [...fixed,...Object.keys(data.sections).filter(k=>!fixed.includes(k))]){
const lines=text(data.sections[key]).replace(/\r/g,'').split('\n'),own=!fixed.includes(key)&&/^# /.test(lines[0]);
add('section-'+key,own?lines.shift().slice(2):fixed.includes(key)?t(key):key[0].toUpperCase()+key.slice(1).replace(/-/g,' '),markdown(lines));
}
$('#content').innerHTML=sections.map(s=>'<section id="'+s.id+'"><h2>'+esc(s.title)+'</h2>'+s.body+'</section>').join('');
const nav=$('nav');nav.setAttribute('aria-label',t('sections'));nav.innerHTML=sections.map(s=>'<a href="#'+s.id+'">'+esc(s.title)+'</a>').join('');
$$('.copy').forEach(b=>{b.textContent=t('copy');b.setAttribute('aria-live','polite');b.onclick=async()=>{try{await navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent=t('copied')}catch(e){b.textContent=t('copyFailed')}}});
const toggle=$('#language');toggle.hidden=data.langs.length!==2;toggle.textContent=L[data.langs.find(l=>l!==lang)]?.name||'';
themeLabel();spy();
}
function spy(){
if(clicked&&(pinY===undefined||scrollY===pinY))return mark(clicked);
clicked=null;const sections=[...$$('section')],limit=parseFloat(getComputedStyle(root).scrollPaddingTop)+8;let id=sections[0]?.id;
for(const s of sections)if(s.getBoundingClientRect().top<=limit)id=s.id;
mark(id);
}
function mark(id){const nav=$('nav');for(const a of $$('nav a'))if(a.hash==='#'+id){a.setAttribute('aria-current','true');if(nav.scrollWidth>nav.clientWidth)nav.scrollLeft=a.offsetLeft-nav.offsetLeft-(nav.clientWidth-a.offsetWidth)/2}else a.removeAttribute('aria-current')}
function opened(){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target?.tagName==='DETAILS')target.open=true}
// The icon shows the theme that a click selects: a moon in light mode, a sun in dark mode.
const icons={dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.1A8 8 0 1 0 19.9 13A6.5 6.5 0 0 1 11 4.1z" fill="currentColor"/></svg>',light:'<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>'};
function themeLabel(){const b=$('#theme'),next=getComputedStyle(root).colorScheme==='dark'?'light':'dark';b.innerHTML=icons[next];b.setAttribute('aria-label',t(next));b.title=t('theme')}
$('nav').onclick=e=>{const a=e.target.closest('a');if(a){clicked=a.hash.slice(1);pinY=undefined;mark(clicked);requestAnimationFrame(()=>{pinY=scrollY})}};
$('#theme').onclick=()=>{const theme=getComputedStyle(root).colorScheme==='dark'?'light':'dark';
if(matchMedia('(prefers-color-scheme:dark)').matches===(theme==='dark')){delete root.dataset.theme;store('html-docs-theme',null)}else{root.dataset.theme=theme;store('html-docs-theme',theme)}themeLabel()};
$('#language').onclick=()=>{lang=data.langs.find(l=>l!==lang);store('html-docs-lang',lang);render()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeLabel);
addEventListener('scroll',spy,{passive:true});addEventListener('resize',spy);addEventListener('hashchange',opened);
let closed=[];addEventListener('beforeprint',()=>{closed=[...$$('details:not([open])')];closed.forEach(d=>d.open=true)});addEventListener('afterprint',()=>closed.forEach(d=>d.open=false));
render();opened();
</script>
